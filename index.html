<h1>GRE 智慧單字本 A–D</h1>
<div class="sub">整合 1710 字單字本與 Vocab A–D。出題優先抽較少看過的字；主題集中的核心字不重複；答題後顯示同義詞與補習班記憶法；⭐ 可標記一直記不住的字。</div>
<div class="tabs">
<button class="tab active" data-pane="bank">單字本</button><button class="tab" data-pane="topics">主題單字集</button><button class="tab" data-pane="history">練習紀錄</button><button class="tab" data-pane="wrong">常錯單字</button><button class="tab" data-pane="starred">⭐ 難記單字</button><button class="tab" data-pane="roots">字根整理</button><button class="tab" data-pane="synindex">完整同義詞索引</button>
</div>

<section id="bank" class="pane"><div class="panel"><div class="grid">
<div class="field"><label>起始編號</label><input id="bStart" type="number" value="1" min="1"></div><div class="field"><label>結束編號</label><input id="bEnd" type="number" value="100" min="1"></div><div class="field"><label>題數</label><input id="bCount" type="number" value="20" min="1"></div>
</div><div class="grid" style="margin-top:10px"><div class="field"><label>模式</label><select id="bMode"><option value="mcq">四選一</option><option value="flash">閃卡自評</option></select></div><div class="field"><label>題庫</label><select disabled><option>1710 字完整單字本</option></select></div><div class="field"><label>&nbsp;</label><button id="bStartBtn" class="primary" style="width:100%">開始</button></div></div><div id="bError" class="note"></div></div></section>

<section id="topics" class="pane hidden"><div class="panel"><div class="filters" id="sourceFilters">
<button class="filter active" data-source="all">全部 A–D</button><button class="filter" data-source="A">Vocab A</button><button class="filter" data-source="B">Vocab B</button><button class="filter" data-source="C">Vocab C</button><button class="filter" data-source="D">Vocab D</button></div>
<input id="topicSearch" placeholder="搜尋主題、單字或中文意思" style="margin-top:12px"></div><div id="topicGrid" class="topic-grid"></div></section>

<section id="history" class="pane hidden"><div class="note" style="margin-bottom:10px">紀錄存在瀏覽器本機。建議偶爾匯出備份，換電腦或清除瀏覽器資料前尤其重要。</div>
<div class="memory-summary"><div class="stat"><div class="k">練習次數</div><div id="sSessions" class="v">0</div></div><div class="stat"><div class="k">總練習時間</div><div id="sTime" class="v">0m</div></div><div class="stat"><div class="k">累積作答</div><div id="sAttempts" class="v">0</div></div><div class="stat"><div class="k">整體正確率</div><div id="sAcc" class="v">0%</div></div></div>
<div class="actions" style="margin-bottom:12px"><button id="exportHistory" class="secondary">匯出學習紀錄</button><label class="secondary" style="padding:11px 14px;border-radius:12px;cursor:pointer">匯入學習紀錄<input id="importHistory" type="file" accept=".json" style="display:none"></label></div>
<div id="historyList" class="history-list"></div><div class="actions" style="margin-top:12px"><button id="clearHistory" class="bad">清除全部紀錄</button></div></section>

<section id="wrong" class="pane hidden"><div class="note" style="margin-bottom:10px">依累積答錯次數排序，同時顯示被抽到的總次數與錯誤率。</div><div id="wrongList"></div></section>
<section id="starred" class="pane hidden"><div class="note" style="margin-bottom:10px">主動按 ⭐ 的字也會併入常錯集合。</div><div id="starredList"></div></section>
<section id="roots" class="pane hidden"><div class="panel"><div class="filters" id="rootFilters"><button class="filter active" data-root-source="all">全部 A–D</button><button class="filter" data-root-source="A">A</button><button class="filter" data-root-source="B">B</button><button class="filter" data-root-source="C">C</button><button class="filter" data-root-source="D">D</button></div></div><div id="rootGrid" class="root-grid"></div></section>


<section id="synindex" class="pane hidden">
  <div class="panel">
    <div class="grid">
      <div class="field"><label>講義</label><select id="synSource"><option value="all">全部 A–D</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
      <div class="field" style="grid-column:span 2"><label>搜尋單字／中文／同義詞</label><input id="synSearch" placeholder="例如：fake、駁斥、prudent"></div>
    </div>
    <div class="note" style="margin-top:10px">這裡不是只顯示「有被我分進主題的字」，而是把 A–D 講義中每個有「同」欄位的字全部列出來。</div>
  </div>
  <div id="synIndexStats" class="note" style="margin-bottom:10px"></div>
  <div id="synIndexList" class="history-list"></div>
</section>
<section id="practice" class="pane hidden"><div class="actions" style="margin-bottom:10px"><button id="practiceBack" class="secondary">← 返回</button></div>
<div class="panel"><div id="practiceTitle" style="font-size:21px;font-weight:800;margin-bottom:6px"></div><div id="practiceLabel" class="note" style="margin-bottom:10px"></div><div id="practiceSetup"><div class="grid">
<div class="field"><label>模式</label><select id="pMode"><option value="mcq">四選一</option><option value="flash">閃卡自評</option></select></div><div class="field"><label>題數</label><input id="pCount" type="number" value="10" min="1"></div><div class="field"><label>&nbsp;</label><button id="pStart" class="primary" style="width:100%">開始練習</button></div></div><div id="pError" class="note"></div></div></div>
<div id="runCard" class="card hidden"><div class="progress"><span id="runProg"></span><span id="runScore"></span></div><div id="runWord" class="word"></div><div class="word-tools"><button id="starBtn" class="star-btn">☆ 這個字很難記</button></div>
<div id="mcqUI" class="hidden"><div id="choices" class="choice-grid"></div><div id="feedback" class="feedback hidden"></div><div id="nextWrap" class="actions center hidden"><button id="nextBtn" class="primary">下一題</button></div></div>
<div id="flashUI" class="hidden"><div class="actions center"><button id="reveal" class="primary">顯示答案</button></div><div id="flashAns" class="answer hidden"></div><div id="judge" class="actions center hidden"><button id="noBtn" class="bad">🔴 不記得</button><button id="yesBtn" class="good">🟢 記得</button></div></div></div><div id="runResult" class="result hidden"></div></section>

const MEMKEY="GRESmartVocabHistory_v1"; const STARMEM="GRESmartVocabStars_v1"; const SEENMEM="GRESmartVocabSeen_v1"; const $=id=>document.getElementById(id);

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mem(){try{return JSON.parse(localStorage.getItem(MEMKEY)||"[]")}catch(e){return[]}} function save(x){localStorage.setItem(MEMKEY,JSON.stringify(x))}
function starMem(){try{return JSON.parse(localStorage.getItem(STARMEM)||"{}")}catch(e){return{}}}
function seenMem(){try{return JSON.parse(localStorage.getItem(SEENMEM)||"{}")}catch(e){return{}}}
function wordKey(w){return String(w||"").trim().toLowerCase()}
function allSynsFor(w){let k=wordKey(w),o=[];ALL_SYNONYMS.forEach(e=>{if(wordKey(e.word)===k)(e.synonyms||[]).forEach(s=>{if(s&&!o.includes(s))o.push(s)})});return o}
function mnemonicFor(w){let k=wordKey(w),e=ALL_SYNONYMS.find(e=>wordKey(e.word)===k&&e.mnemonic);return e?e.mnemonic:""}
function noteSeen(w){let m=seenMem(),k=wordKey(w);m[k]=(m[k]||0)+1;localStorage.setItem(SEENMEM,JSON.stringify(m))}
function isStarred(w){return !!starMem()[wordKey(w)]}
function toggleStar(w,zh){let m=starMem(),k=wordKey(w);if(m[k])delete m[k];else m[k]={word:w,zh:zh||"",starredAt:Date.now()};localStorage.setItem(STARMEM,JSON.stringify(m));updateStarButton();renderStarred();renderWrong()}
function updateStarButton(){if(!$("starBtn")||!queue[idx])return;let on=isStarred(queue[idx].word);$("starBtn").textContent=on?"★ 已加入難記單字":"☆ 這個字很難記";$("starBtn").classList.toggle("starred",on)}

function dt(ms){return new Date(ms).toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function dur(sec){sec=Math.max(1,Math.round(sec));if(sec<60)return sec+" 秒";let m=Math.floor(sec/60),s=sec%60;return s?`${m} 分 ${s} 秒`:`${m} 分`}

$("bStart").max=WORDS.length;$("bEnd").max=WORDS.length;

function uniqueTopicGroups(){let owned=new Set();return GROUPS.map(g=>{let kept=[];(g.entries||[]).forEach(e=>{let k=wordKey(e.word);if(!owned.has(k)){owned.add(k);kept.push(e)}});return Object.assign({},g,{entries:kept})}).filter(g=>g.entries.length)}

$("topicSearch").addEventListener("input",renderTopics);
document.querySelectorAll("#sourceFilters .filter").forEach(b=>b.addEventListener("click",()=>{topicSource=b.dataset.source;document.querySelectorAll("#sourceFilters .filter").forEach(x=>x.classList.toggle("active",x===b));renderTopics()}));renderTopics();

function renderRoots(){let rs=ROOTS.filter(r=>rootSource==="all"||r.source===rootSource);$("rootGrid").innerHTML=rs.length?rs.map(r=>`<div class="root-card"><div class="root">${esc(r.root)}<span class="source-badge">${r.source}</span></div>${r.examples?`<div class="note">例：${esc(r.examples)}</div>`:""}<div class="note">${esc(r.note)}</div></div>`).join(""):'<div class="note">這份講義沒有額外標記可擷取的字根補充。</div>'}
document.querySelectorAll("#rootFilters .filter").forEach(b=>b.addEventListener("click",()=>{rootSource=b.dataset.rootSource;document.querySelectorAll("#rootFilters .filter").forEach(x=>x.classList.toggle("active",x===b));renderRoots()}));renderRoots();


function renderSynIndex(){
  const src=$("synSource").value, q=$("synSearch").value.trim().toLowerCase();
  let rows=ALL_SYNONYMS.filter(e=>(src==="all"||e.source===src)&&e.synonyms&&e.synonyms.length&&(!q||[e.word,e.zh,...e.synonyms].join(" ").toLowerCase().includes(q)));
  $("synIndexStats").textContent=`目前顯示 ${rows.length} 個有同義詞資料的講義單字；A–D 共擷取 ${ALL_SYNONYMS.filter(e=>e.synonyms&&e.synonyms.length).length} 個。`;
  $("synIndexList").innerHTML=rows.map(e=>`<div class="history-item"><div class="history-head"><div><b>${esc(e.word)}</b><span class="source-badge">${e.source}</span><div class="meta">${esc(e.zh)}</div></div></div><div class="history-words">${e.synonyms.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>${e.mnemonic?`<div class="note" style="margin-top:8px">記憶法：${esc(e.mnemonic)}</div>`:""}</div>`).join("")||'<div class="note">沒有符合的結果。</div>';
}
$("synSource").addEventListener("change",renderSynIndex);
$("synSearch").addEventListener("input",renderSynIndex);

function openTheme(id){currentSource="theme";currentTheme=GROUPS.find(g=>g.id===id);lastPane="topics";$("practiceTitle").textContent=currentTheme.theme+` [${currentTheme.source}]`;$("practiceLabel").textContent="講義標籤："+currentTheme.label+"｜"+currentTheme.entries.map(e=>e.word).join(" · ");$("pCount").max=currentTheme.entries.length;$("pCount").value=Math.min(10,currentTheme.entries.length);showPane("practice");resetPracticeUI()}
function resetPracticeUI(){$("practiceSetup").classList.remove("hidden");$("runCard").classList.add("hidden");$("runResult").classList.add("hidden")} $("practiceBack").addEventListener("click",()=>showPane(lastPane));

$("bStartBtn").addEventListener("click",()=>{let s=Number($("bStart").value),e=Number($("bEnd").value),c=Number($("bCount").value);$("bError").textContent="";if(!Number.isInteger(s)||!Number.isInteger(e)||!Number.isInteger(c)||s<1||e>WORDS.length||s>e||c<1||c>(e-s+1)){$("bError").textContent="請確認範圍與題數。";return}
currentSource="bank";currentTheme={theme:`單字本 ${s}–${e}`,source:"Master",label:"完整單字本",entries:WORDS.slice(s-1,e)};lastPane="bank";$("pMode").value=$("bMode").value;$("pCount").value=c;$("pCount").max=e-s+1;$("practiceTitle").textContent=currentTheme.theme;$("practiceLabel").textContent="完整 1710 字題庫";showPane("practice");startPractice()});
$("pStart").addEventListener("click",startPractice);
function pickLeastSeen(pool,count){let s=seenMem(),a=shuffle(pool);a.sort((x,y)=>(s[wordKey(x.word)]||0)-(s[wordKey(y.word)]||0));return a.slice(0,count)}
function norm(e){return {word:e.word||e.en,zh:e.zh||"",mnemonic:e.mnemonic||"",synonyms:e.synonyms||"",theme:currentTheme.theme}}
function startPractice(){let c=Number($("pCount").value),pool=currentTheme.entries.map(norm);$("pError").textContent="";if(!Number.isInteger(c)||c<1||c>pool.length){$("pError").textContent=`題數請設在 1–${pool.length}`;return}queue=pickLeastSeen(pool,c);idx=0;correct=0;wrong=0;answers=[];started=Date.now();$("practiceSetup").classList.add("hidden");$("runResult").classList.add("hidden");$("runCard").classList.remove("hidden");renderRun()}
function distract(target){let pool=currentSource==="theme"?GROUPS.flatMap(g=>g.entries.map(e=>({word:e.word,zh:e.zh}))):currentTheme.entries.map(norm);let seen=new Set([target.zh]),out=[];for(let e of shuffle(pool)){if(e.word!==target.word&&e.zh&&!seen.has(e.zh)){seen.add(e.zh);out.push(e);if(out.length===3)break}}return out}
function renderRun(){if(idx>=queue.length){finishRun();return}let e=queue[idx],mode=$("pMode").value;locked=false;noteSeen(e.word);$("runProg").textContent=`第 ${idx+1}/${queue.length} 題`;$("runScore").textContent=`答對 ${correct}｜錯 ${wrong}`;$("runWord").textContent=e.word;updateStarButton();$("mcqUI").classList.toggle("hidden",mode!=="mcq");$("flashUI").classList.toggle("hidden",mode!=="flash");
if(mode==="mcq"){let opts=shuffle([{zh:e.zh,ok:true},...distract(e).map(x=>({zh:x.zh,ok:false}))]);$("choices").innerHTML="";opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.dataset.ok=o.ok?"1":"0";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${esc(o.zh)}`;b.addEventListener("click",()=>answerMCQ(b,e));$("choices").appendChild(b)});$("feedback").classList.add("hidden");$("nextWrap").classList.add("hidden")}
else{let sy=allSynsFor(e.word),mn=mnemonicFor(e.word)||e.mnemonic;$("flashAns").innerHTML=`<b>${esc(e.zh)}</b>${sy.length?`<div class="review-box"><b>同義詞：</b>${sy.map(esc).join(" · ")}</div>`:""}${mn?`<div class="review-box"><b>補習班記憶法：</b>${esc(mn)}</div>`:""}`;$("flashAns").classList.add("hidden");$("judge").classList.add("hidden");$("reveal").classList.remove("hidden")}}
function answerMCQ(b,e){if(locked)return;locked=true;let ok=b.dataset.ok==="1";document.querySelectorAll("#choices .choice").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("correct")});if(!ok)b.classList.add("wrong");if(ok)correct++;else wrong++;answers.push({word:e.word,zh:e.zh,correct:ok});let sy=allSynsFor(e.word),mn=mnemonicFor(e.word);$("feedback").innerHTML=`${ok?"答對。":"再記一下。"} <b>${esc(e.word)}</b> = ${esc(e.zh)}${sy.length?`<div class="review-box"><b>同義詞：</b>${sy.map(esc).join(" · ")}</div>`:""}${mn?`<div class="review-box"><b>補習班記憶法：</b>${esc(mn)}</div>`:""}`;$("feedback").classList.remove("hidden");$("nextWrap").classList.remove("hidden");$("runScore").textContent=`答對 ${correct}｜錯 ${wrong}`}
$("starBtn").addEventListener("click",()=>{if(queue[idx])toggleStar(queue[idx].word,queue[idx].zh)});$("nextBtn").addEventListener("click",()=>{idx++;renderRun()});$("reveal").addEventListener("click",()=>{$("flashAns").classList.remove("hidden");$("judge").classList.remove("hidden");$("reveal").classList.add("hidden")});
function answerFlash(ok){let e=queue[idx];if(ok)correct++;else wrong++;answers.push({word:e.word,zh:e.zh,correct:ok});idx++;renderRun()} $("yesBtn").addEventListener("click",()=>answerFlash(true));$("noBtn").addEventListener("click",()=>answerFlash(false));
function finishRun(){let end=Date.now(),s={id:end,dateTime:end,durationSec:Math.max(1,Math.round((end-started)/1000)),source:currentTheme.source,theme:currentTheme.theme,mode:$("pMode").value,correct,total:queue.length,accuracy:Math.round(correct/queue.length*100),answers};let h=mem();h.unshift(s);save(h);$("runCard").classList.add("hidden");$("runResult").classList.remove("hidden");$("runResult").innerHTML=`<div style="font-size:20px;font-weight:800">${s.correct}/${s.total}（${s.accuracy}%）</div><div class="meta">${dt(s.dateTime)} · ${dur(s.durationSec)} · ${s.mode==="mcq"?"四選一":"閃卡"}</div><div class="history-words">${s.answers.map(a=>`<span class="word-result ${a.correct?"good":"bad"}">${esc(a.word)} ${a.correct?"✓":"✕"}</span>`).join("")}</div><div class="actions" style="margin-top:12px"><button id="viewHist" class="secondary">查看練習紀錄</button></div>`;$("viewHist").addEventListener("click",()=>showPane("history"))}
function renderHistory(){let h=mem(),sec=h.reduce((a,x)=>a+(x.durationSec||0),0),tot=h.reduce((a,x)=>a+(x.total||0),0),cor=h.reduce((a,x)=>a+(x.correct||0),0);$("sSessions").textContent=h.length;$("sTime").textContent=sec<3600?Math.round(sec/60)+"m":(sec/3600).toFixed(1)+"h";$("sAttempts").textContent=tot;$("sAcc").textContent=tot?Math.round(cor/tot*100)+"%":"0%";
$("historyList").innerHTML=h.length?h.map((x,i)=>`<div class="history-item"><div class="history-head"><div><b>${esc(x.theme)}${x.source?` <span class="source-badge">${esc(x.source)}</span>`:""}</b><div class="meta">${dt(x.dateTime)} · ${dur(x.durationSec)} · ${x.mode==="mcq"?"四選一":"閃卡"}</div></div><div style="font-size:20px;font-weight:800">${x.accuracy}%</div></div><button class="secondary toggleHist" data-i="${i}" style="margin-top:10px">查看本次抽樣單字</button><div id="hd${i}" class="history-details hidden"><div>${x.correct}/${x.total} 正確</div><div class="history-words">${(x.answers||[]).map(a=>`<span class="word-result ${a.correct?"good":"bad"}">${esc(a.word)} ${a.correct?"✓":"✕"}</span>`).join("")}</div></div></div>`).join(""):'<div class="note">目前沒有練習紀錄。</div>';document.querySelectorAll(".toggleHist").forEach(b=>b.addEventListener("click",()=>$("hd"+b.dataset.i).classList.toggle("hidden")))}
function renderWrong(){let map={};mem().forEach(s=>(s.answers||[]).forEach(a=>{let k=wordKey(a.word);if(!map[k])map[k]={word:a.word,zh:a.zh,n:0,w:0,star:false};map[k].n++;if(!a.correct)map[k].w++}));Object.entries(starMem()).forEach(([k,s])=>{if(!map[k])map[k]={word:s.word,zh:s.zh,n:0,w:0,star:true};map[k].star=true});let arr=Object.values(map).filter(x=>x.w||x.star).sort((a,b)=>(b.star?1:0)-(a.star?1:0)||b.w-a.w);$("wrongList").innerHTML=arr.length?arr.map(x=>`<div class="freq-row"><div><b>${esc(x.word)}</b>${x.star?'<span class="badge-star">★ 難記</span>':""}<div class="note">${esc(x.zh)}</div></div><div class="num">${x.w}/${x.n}</div><div class="num">${x.n?Math.round(x.w/x.n*100)+"%":"★"}</div></div>`).join(""):'<div class="note">目前沒有累積錯字或難記字。</div>'}
function renderStarred(){let a=Object.values(starMem()).sort((x,y)=>y.starredAt-x.starredAt);$("starredList").innerHTML=a.length?a.map(x=>{let sy=allSynsFor(x.word),mn=mnemonicFor(x.word);return `<div class="history-item"><b>${esc(x.word)}</b><span class="badge-star">★</span><div class="meta">${esc(x.zh)}</div>${sy.length?`<div class="history-words">${sy.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>`:""}${mn?`<div class="note" style="margin-top:8px">記憶法：${esc(mn)}</div>`:""}<button class="secondary unstar" data-word="${esc(x.word)}" style="margin-top:10px">移除星號</button></div>`}).join(""):'<div class="note">目前沒有加星號的字。</div>';document.querySelectorAll(".unstar").forEach(b=>b.addEventListener("click",()=>toggleStar(b.dataset.word,"")))}
$("clearHistory").addEventListener("click",()=>{if(confirm("確定清除全部練習紀錄？")){localStorage.removeItem(MEMKEY);renderHistory();renderWrong()}});
$("exportHistory").addEventListener("click",()=>{let blob=new Blob([JSON.stringify(mem(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="GRE_學習紀錄_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$("importHistory").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;save(x);renderHistory();alert("學習紀錄已匯入。")}catch(_){alert("這不是有效的學習紀錄 JSON。")}};r.readAsText(f);e.target.value=""});
</script></main><script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
